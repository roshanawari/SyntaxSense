{% extends 'base.html' %}
{% load static %}

{% block title %}Register - SyntaxSense{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="card">
    <div class="card-header" style="margin-bottom: 1.5rem;">
      <h1 class="card-title" style="font-size: 1.5rem; margin-bottom: 0;">Create an account</h1>
    </div>

    <div id="register-error" class="state-error" style="display: none;"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="email" class="form-label">Email address</label>
        <input type="email" id="email" class="form-input" required autocomplete="email" placeholder="student@example.com">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-input" required minlength="8" maxlength="128" placeholder="At least 8 characters">
      </div>

      <div style="margin-top: 1.5rem; margin-bottom: 1rem;">
        <button type="submit" class="btn btn-primary" id="btn-register" style="width: 100%;">Create account</button>
      </div>

      <p class="text-sm text-muted" style="text-align: center; margin: 0;">
        Already have an account? <a href="/login" id="link-login">Log in</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/register.js' %}"></script>
{% endblock %}
